name: Build 见山 (修复 + 自有包名)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体标记（仅用于文件名）'
        required: false
        default: 'stock'
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          large-packages: true
          swap-storage: true

      # 官方文档要求 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Use preinstalled Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK" 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls "$SDK"
          ls "$SDK/platforms" || true

      - name: Install NDK + CMake + platform
        run: |
          set -uo pipefail
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.3.13750724" "cmake;3.22.1" "build-tools;37.0.0" "platforms;android-37.0" > /tmp/ndk.log 2>&1 \
            || { echo "--- 完整安装日志 ---"; cat /tmp/ndk.log; echo "--- 回退：只装 ndk/cmake ---"; \
                 "$SDKM" --install "ndk;27.3.13750724" "cmake;3.22.1" > /tmp/ndk2.log 2>&1 || { tail -40 /tmp/ndk2.log; exit 1; }; }
          ls "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx9g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      # 官方文档：签名 4 项 + apiId/apiHash/helperBot/sentryDsn/mapsApiKey + google-services.json
      - name: Configure Signing + Secrets (官方方式)
        run: |
          set -euo pipefail
          echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          : > local.properties
          echo "storeFile=$GITHUB_WORKSPACE/keystore.jks"       >> local.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"          >> local.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"    >> local.properties
          echo "apiId=${{ secrets.APP_API_ID }}"                    >> local.properties
          echo "apiHash=${{ secrets.APP_API_HASH }}"                >> local.properties
          echo "helperBotId=${{ secrets.HELPER_BOT_ID }}"           >> local.properties
          echo "helperBotUsername=${{ secrets.HELPER_BOT_USERNAME }}" >> local.properties
          echo "sentryDsn=${{ secrets.SENTRY_DSN }}"                >> local.properties
          echo "mapsApiKey=${{ secrets.MAPS_API_KEY }}"             >> local.properties
          if [ -f TMessagesProj_App/google-services.json ]; then
            echo "→ 使用仓库内自带的 google-services.json"
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > TMessagesProj_App/google-services.json
          fi
          python3 -c "import json;d=json.load(open('TMessagesProj_App/google-services.json'));print('gms packages:',[c['client_info']['android_client_info']['package_name'] for c in d['client']])"
          sed 's/^\(apiHash\|storePassword\|keyPassword\)=.*/\1=****/' local.properties

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          ST=${PIPESTATUS[0]}
          if [ "$ST" -ne 0 ]; then
            echo ">>> What went wrong:"; awk '/What went wrong/,0' /tmp/build.log | head -60
            echo ">>> 关键行:"; grep -nE "error:|FAILURE:|Caused by:|Execution failed|Auth token" /tmp/build.log | head -30
            exit "$ST"
          fi

      - name: Error summary
        if: failure()
        run: |
          { echo "## ❌ 构建失败"; echo '```'; awk '/What went wrong/,0' /tmp/build.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: List APKs
        if: success()
        run: |
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n'

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jianshan-fixpkg
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
